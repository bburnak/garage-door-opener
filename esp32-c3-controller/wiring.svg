<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ESP32-C3 garage door controller wiring</title>
  <desc>ESP32-C3 3V3, GND and GPIO4 connect to relay VCC, GND and IN. A 10k pull-down resistor connects GPIO4 to GND. Relay COM and NO connect across the garage opener button terminals.</desc>
  <rect width="780" height="440" fill="#ffffff"/>

  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">ESP32-C3 garage door controller wiring</text>

  <!-- ESP32-C3 -->
  <rect x="40" y="70" width="170" height="240" rx="10" fill="#eef3fb" stroke="#3b5b92" stroke-width="2"/>
  <text x="125" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">ESP32-C3 Mini</text>
  <g font-size="14" fill="#1f2328" text-anchor="end">
    <text x="196" y="145">3V3</text>
    <text x="196" y="215">GND</text>
    <text x="196" y="285">GPIO4</text>
  </g>
  <g fill="#3b5b92">
    <circle cx="210" cy="140" r="5"/>
    <circle cx="210" cy="210" r="5"/>
    <circle cx="210" cy="280" r="5"/>
  </g>

  <!-- Relay module -->
  <rect x="340" y="70" width="170" height="240" rx="10" fill="#fdf3e7" stroke="#b36b00" stroke-width="2"/>
  <text x="425" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Relay module</text>
  <text x="425" y="116" text-anchor="middle" font-size="11" fill="#57606a">3.3V logic</text>
  <g font-size="14" fill="#1f2328">
    <text x="354" y="145">VCC</text>
    <text x="354" y="215">GND</text>
    <text x="354" y="285">IN</text>
  </g>
  <g font-size="14" fill="#1f2328" text-anchor="end">
    <text x="496" y="145">COM</text>
    <text x="496" y="215">NO</text>
    <text x="496" y="285" fill="#8b949e">NC (unused)</text>
  </g>
  <g fill="#b36b00">
    <circle cx="340" cy="140" r="5"/>
    <circle cx="340" cy="210" r="5"/>
    <circle cx="340" cy="280" r="5"/>
    <circle cx="510" cy="140" r="5"/>
    <circle cx="510" cy="210" r="5"/>
  </g>
  <circle cx="510" cy="280" r="5" fill="#ffffff" stroke="#8b949e" stroke-width="2"/>

  <!-- Power and signal wires -->
  <line x1="210" y1="140" x2="340" y2="140" stroke="#d1242f" stroke-width="3"/>
  <line x1="210" y1="210" x2="340" y2="210" stroke="#1f2328" stroke-width="3"/>
  <line x1="210" y1="280" x2="340" y2="280" stroke="#1a7f37" stroke-width="3"/>
  <text x="275" y="132" text-anchor="middle" font-size="12" fill="#d1242f">3.3 V (or 5 V)</text>
  <text x="275" y="202" text-anchor="middle" font-size="12" fill="#1f2328">ground</text>
  <text x="275" y="272" text-anchor="middle" font-size="12" fill="#1a7f37">control signal</text>

  <!-- Pull-down resistor on GPIO4 -->
  <circle cx="275" cy="280" r="4" fill="#1a7f37"/>
  <line x1="275" y1="280" x2="275" y2="330" stroke="#1a7f37" stroke-width="3"/>
  <rect x="263" y="330" width="24" height="44" fill="#ffffff" stroke="#1a7f37" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="299" y="352" font-size="12" fill="#1f2328">10k pull-down</text>
  <text x="299" y="367" font-size="11" fill="#57606a">optional: add if relay clicks at boot</text>
  <line x1="275" y1="374" x2="275" y2="394" stroke="#1f2328" stroke-width="3"/>
  <line x1="260" y1="394" x2="290" y2="394" stroke="#1f2328" stroke-width="3"/>
  <line x1="266" y1="402" x2="284" y2="402" stroke="#1f2328" stroke-width="3"/>
  <line x1="272" y1="410" x2="278" y2="410" stroke="#1f2328" stroke-width="3"/>
  <text x="299" y="404" font-size="12" fill="#57606a">GND</text>

  <!-- Opener -->
  <rect x="620" y="100" width="130" height="140" rx="10" fill="#f3f3f3" stroke="#57606a" stroke-width="2"/>
  <text x="685" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Garage opener</text>
  <text x="685" y="140" text-anchor="middle" font-size="11" fill="#57606a">button terminals</text>
  <g font-size="13" fill="#1f2328">
    <text x="636" y="215">Terminal B</text>
    <text x="636" y="165">Terminal A</text>
  </g>
  <g fill="#57606a">
    <circle cx="620" cy="160" r="5"/>
    <circle cx="620" cy="210" r="5"/>
  </g>

  <!-- Dry-contact wires: COM -> A, NO -> B (routed with a bend) -->
  <polyline points="510,140 565,140 565,160 620,160" fill="none" stroke="#b36b00" stroke-width="3"/>
  <polyline points="510,210 620,210" fill="none" stroke="#b36b00" stroke-width="3"/>
  <text x="565" y="128" text-anchor="middle" font-size="12" fill="#b36b00">dry contact</text>

  <!-- Notes -->
  <g font-size="12" fill="#57606a">
    <text x="440" y="340">Dry contact only: COM and NO act as a switch across</text>
    <text x="440" y="358">the same two wires the wall button uses. Nothing from</text>
    <text x="440" y="376">the ESP32 side connects to the opener circuit.</text>
    <text x="440" y="400">Active-low relay: set RELAY_ACTIVE_LOW true and</text>
    <text x="440" y="418">use a 10k pull-up to 3V3 instead of the pull-down.</text>
  </g>
</svg>
